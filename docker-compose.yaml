services:
  database:
    image: mongo:7
    container_name: fascm-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_username
      MONGO_INITDB_ROOT_PASSWORD: mongo_password
      MONGO_INITDB_DATABASE: mongo_database
    ports:
      - 27017:27017
    volumes:
      - fascm-mongodb-data:/data/db
    networks:
      - my-network

  mongo-express:
    depends_on:
      - database
    image: mongo-express
    container_name: fascm-mongo-express
    restart: always
    ports:
      - "8090:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: mongo_username
      ME_CONFIG_MONGODB_ADMINPASSWORD: mongo_password
      ME_CONFIG_MONGODB_SERVER: database
    networks:
      - my-network

networks:
  my-network:

volumes:
  fascm-mongodb-data:
